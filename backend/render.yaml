services:
  - type: web
    name: cloudide-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node simple-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false  # This will need to be set manually in Render dashboard